<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
  <path d="M76,400 Q75,325 95,305 Q110,290 145,285 L178,282 L178,265 L222,265 L222,282 L255,285 Q290,290 305,305 Q325,325 324,400 Z" fill="#FFDBB4" stroke="#333" stroke-width="2"/>
  <line x1="110" y1="340" x2="110" y2="398" stroke="#333" stroke-width="1.5" stroke-linecap="round"/><line x1="290" y1="340" x2="290" y2="398" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M113,163 Q113,59 200,55 Q287,59 287,163 Q287,268 200,280 Q113,268 113,163 Z" fill="#FFDBB4" stroke="#333" stroke-width="2"/>
  <!-- Nose -->
  <path d="M193,190 Q200,200 207,190" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M113,155 Q101,167 113,181 Z" fill="#FFDBB4" stroke="#333" stroke-width="2"/><path d="M111,162 Q109,167 111,173" fill="none" stroke="#333" stroke-width="1.5"/><path d="M287,155 Q299,167 287,181 Z" fill="#FFDBB4" stroke="#333" stroke-width="2"/><path d="M289,162 Q291,167 289,173" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- Left eye - heavy upper lid, eye barely open from below -->
  <path d="M151,160 L189,160 Q170,172 151,160 Z" fill="#FFF" stroke="#333" stroke-width="2"/>
  <circle cx="170" cy="164" r="2.5" fill="#333"/>
  <!-- Right eye - heavy upper lid, eye barely open from below -->
  <path d="M211,160 L249,160 Q230,172 211,160 Z" fill="#FFF" stroke="#333" stroke-width="2"/>
  <circle cx="230" cy="164" r="2.5" fill="#333"/>
  <path d="M147,128 Q170,118 193,128" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/><path d="M207,128 Q230,118 253,128" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Open mouth -->
  <path d="M175,220 Q200,246 225,220 Z" fill="#333" stroke="#333" stroke-width="2"/>
  <!-- Upper teeth row (curved) -->
  <path d="M178,220 Q200,230 222,220 Z" fill="#FFF" stroke="none"/>
  <!-- Tooth dividers -->
  <line x1="185" y1="220" x2="185" y2="222" stroke="#333" stroke-width="1"/>
  <line x1="192" y1="220" x2="192" y2="224" stroke="#333" stroke-width="1"/>
  <line x1="200" y1="220" x2="200" y2="225" stroke="#333" stroke-width="1"/>
  <line x1="208" y1="220" x2="208" y2="224" stroke="#333" stroke-width="1"/>
  <line x1="215" y1="220" x2="215" y2="222" stroke="#333" stroke-width="1"/>
  <!-- Left lens -->
  <circle cx="170" cy="158" r="24" fill="#FFF" fill-opacity="0.2" stroke="#333" stroke-width="2.5"/>
  <!-- Right lens -->
  <circle cx="230" cy="158" r="24" fill="#FFF" fill-opacity="0.2" stroke="#333" stroke-width="2.5"/>
  <!-- Bridge -->
  <path d="M194,155 Q200,148 206,155" fill="none" stroke="#333" stroke-width="2"/>
  <!-- Left temple -->
  <line x1="146" y1="152" x2="110" y2="148" stroke="#333" stroke-width="2"/>
  <!-- Right temple -->
  <line x1="254" y1="152" x2="290" y2="148" stroke="#333" stroke-width="2"/>
</svg>
