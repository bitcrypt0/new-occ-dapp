<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
  <path d="M86,400 Q85,325 105,305 Q120,290 152,285 L180,282 L180,265 L220,265 L220,282 L248,285 Q280,290 295,305 Q315,325 314,400 Z" fill="#D08B5B" stroke="#333" stroke-width="2"/>
  <line x1="112" y1="340" x2="112" y2="398" stroke="#333" stroke-width="1.5" stroke-linecap="round"/><line x1="288" y1="340" x2="288" y2="398" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M115,165 Q115,62 200,58 Q285,62 285,165 Q285,268 200,280 Q115,268 115,165 Z" fill="#D08B5B" stroke="#333" stroke-width="2"/>
  <!-- Nose -->
  <path d="M194,191 Q200,201 206,191" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M115,153 Q103,166 115,180 Z" fill="#D08B5B" stroke="#333" stroke-width="2"/><path d="M113,160 Q111,166 113,172" fill="none" stroke="#333" stroke-width="1.5"/><path d="M285,153 Q297,166 285,180 Z" fill="#D08B5B" stroke="#333" stroke-width="2"/><path d="M287,160 Q289,166 287,172" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- Left eye - heavy upper lid, eye barely open from below -->
  <path d="M151,160 L189,160 Q170,172 151,160 Z" fill="#FFF" stroke="#333" stroke-width="2"/>
  <circle cx="170" cy="164" r="2.5" fill="#333"/>
  <!-- Right eye - heavy upper lid, eye barely open from below -->
  <path d="M211,160 L249,160 Q230,172 211,160 Z" fill="#FFF" stroke="#333" stroke-width="2"/>
  <circle cx="230" cy="164" r="2.5" fill="#333"/>
  <path d="M147,128 Q170,118 193,128" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/><path d="M207,128 Q230,118 253,128" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="228" r="12" fill="#333" stroke="#333" stroke-width="2"/>
  <!-- White frame -->
  <rect x="140" y="132" width="54" height="52" rx="8" fill="none" stroke="#EEE" stroke-width="3"/>
  <rect x="206" y="132" width="54" height="52" rx="8" fill="none" stroke="#EEE" stroke-width="3"/>
  <!-- Left lens (red) -->
  <rect x="142" y="134" width="50" height="48" rx="7" fill="#FF0000" fill-opacity="0.45" stroke="#333" stroke-width="2"/>
  <!-- Right lens (cyan) -->
  <rect x="208" y="134" width="50" height="48" rx="7" fill="#00BFFF" fill-opacity="0.45" stroke="#333" stroke-width="2"/>
  <!-- Bridge -->
  <path d="M194,154 Q200,146 206,154" fill="none" stroke="#EEE" stroke-width="3"/>
  <!-- Left temple -->
  <line x1="140" y1="154" x2="114" y2="148" stroke="#EEE" stroke-width="3"/>
  <!-- Right temple -->
  <line x1="260" y1="154" x2="286" y2="148" stroke="#EEE" stroke-width="3"/>
</svg>
