  <path d="M113,163 Q113,59 200,55 Q287,59 287,163 Q287,268 200,280 Q113,268 113,163 Z" fill="#FFDBB4" stroke="#333" stroke-width="2"/>
  <!-- Nose -->
  <path d="M193,190 Q200,200 207,190" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M113,155 Q101,167 113,181 Z" fill="#FFDBB4" stroke="#333" stroke-width="2"/><path d="M111,162 Q109,167 111,173" fill="none" stroke="#333" stroke-width="1.5"/><path d="M287,155 Q299,167 287,181 Z" fill="#FFDBB4" stroke="#333" stroke-width="2"/><path d="M289,162 Q291,167 289,173" fill="none" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="170" cy="158" rx="18" ry="18" fill="#FFF" stroke="#333" stroke-width="2"/>
  <ellipse cx="230" cy="158" rx="18" ry="18" fill="#FFF" stroke="#333" stroke-width="2"/>
  <circle cx="178" cy="160" r="4" fill="#333"/>
  <circle cx="238" cy="160" r="4" fill="#333"/>
  <path d="M147,128 Q170,118 193,128" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/><path d="M207,128 Q230,118 253,128" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="225" x2="220" y2="225" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Main jacket body (neckline matches jacket/turtleneck at y=272) -->
  <path d="M68,400 Q68,323 88,305 Q105,290 145,285 L170,272 L200,394 L230,272 L255,285 Q295,290 312,305 Q332,323 332,400 Z" fill="#A6C0E0" stroke="#333" stroke-width="2"/>
  <!-- Inner shirt body (from neckline down to button) -->
  <path d="M178,282 Q200,288 222,282 L200,394 Z" fill="#F0F0F0" stroke="none"/>
  <!-- Shirt neckline (at top of collars, just below chin) -->
  <path d="M178,282 Q200,288 222,282" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- Shirt left collar fold (from neckline downward, inner edge curves out to lapel) -->
  <path d="M200,288 L165,312 Q178,298 183,288" fill="#F0F0F0" stroke="#333" stroke-width="1.5"/>
  <!-- Shirt right collar fold (from neckline downward, inner edge curves out to lapel) -->
  <path d="M200,288 L235,312 Q222,298 217,288" fill="#F0F0F0" stroke="#333" stroke-width="1.5"/>
  <!-- Left suit lapel (short upper flap, long curved lower fold to button) -->
  <path d="M170,272 L150,292 Q190,352 200,394 L176,276 Z" fill="#A6C0E0" stroke="#333" stroke-width="1.5"/>
  <!-- Right suit lapel (short upper flap, long curved lower fold to button) -->
  <path d="M230,272 L250,292 Q210,352 200,394 L224,276 Z" fill="#A6C0E0" stroke="#333" stroke-width="1.5"/>
  <!-- Shirt buttons -->
  <circle cx="200" cy="305" r="2" fill="#CCC" stroke="#AAA" stroke-width="1"/>
  <circle cx="200" cy="335" r="2" fill="#CCC" stroke="#AAA" stroke-width="1"/>
  <circle cx="200" cy="365" r="2" fill="#CCC" stroke="#AAA" stroke-width="1"/>
  <!-- Suit button at closure -->
  <circle cx="200" cy="394" r="4" fill="#A6C0E0" stroke="#333" stroke-width="1.5"/>
  <!-- Chest pocket -->
  <line x1="128" y1="330" x2="148" y2="330" stroke="#333" stroke-width="1.5"/>
  <!-- Sleeve seams -->
  <line x1="110" y1="340" x2="110" y2="400" stroke="#333" stroke-width="1.5"/>
  <line x1="290" y1="340" x2="290" y2="400" stroke="#333" stroke-width="1.5"/>
</svg>
