  <path d="M184,284 Q200,290 216,284 L200,394 Z" fill="#F0F0F0" stroke="none"/>
  <!-- Shirt neckline (at top of collars, just below chin) -->
  <path d="M184,284 Q200,290 216,284" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- Shirt left collar fold (from neckline downward, inner edge curves out to lapel) -->
  <path d="M200,290 L173,312 Q183,298 188,288" fill="#F0F0F0" stroke="#333" stroke-width="1.5"/>
  <!-- Shirt right collar fold (from neckline downward, inner edge curves out to lapel) -->
  <path d="M200,290 L227,312 Q217,298 212,288" fill="#F0F0F0" stroke="#333" stroke-width="1.5"/>
  <!-- Left suit lapel (short upper flap, long curved lower fold to button) -->
  <path d="M178,275 L158,295 Q188,352 200,394 L184,278 Z" fill="#A6C0E0" stroke="#333" stroke-width="1.5"/>
  <!-- Right suit lapel (short upper flap, long curved lower fold to button) -->
  <path d="M222,275 L242,295 Q212,352 200,394 L216,278 Z" fill="#A6C0E0" stroke="#333" stroke-width="1.5"/>
  <!-- Shirt buttons -->
  <circle cx="200" cy="305" r="2" fill="#CCC" stroke="#AAA" stroke-width="1"/>
  <circle cx="200" cy="335" r="2" fill="#CCC" stroke="#AAA" stroke-width="1"/>
  <circle cx="200" cy="365" r="2" fill="#CCC" stroke="#AAA" stroke-width="1"/>
  <!-- Suit button at closure -->
  <circle cx="200" cy="394" r="4" fill="#A6C0E0" stroke="#333" stroke-width="1.5"/>
  <!-- Chest pocket -->
  <line x1="136" y1="330" x2="154" y2="330" stroke="#333" stroke-width="1.5"/>
  <!-- Bust seams -->
  <path d="M122,350 Q106,374 122,400" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M278,350 Q294,374 278,400" fill="none" stroke="#333" stroke-width="1.5"/>
