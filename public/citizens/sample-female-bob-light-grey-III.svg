<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
<g id="bg-light-grey">
  <rect width="400" height="400" fill="#B5B5B5"/>
</g>

<defs><linearGradient id="fade-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="99%" stop-color="white"/><stop offset="100%" stop-color="black"/></linearGradient><mask id="fade-mask"><rect width="400" height="400" fill="url(#fade-grad)"/></mask></defs>
<g mask="url(#fade-mask)">
<g id="hair-back-none">
  <!-- No back fill needed for this hair variant -->
</g>

<g id="body-female-wide">
  <path d="M86,400 Q85,325 105,305 Q120,290 152,285 L180,282 L180,265 L220,265 L220,282 L248,285 Q280,290 295,305 Q315,325 314,400 Z" fill="#FFDBB4" stroke="#333" stroke-width="2"/>
</g>

<g id="head-round-female">
  <path d="M115,165 Q115,62 200,58 Q285,62 285,165 Q285,268 200,280 Q115,268 115,165 Z" fill="#FFDBB4" stroke="#333" stroke-width="2"/>
  <!-- Nose -->
  <path d="M194,191 Q200,201 206,191" fill="none" stroke="#333" stroke-width="1.5"/>
</g>

<g id="eyes-angry">
  <ellipse cx="170" cy="162" rx="18" ry="16" fill="#FFF" stroke="#333" stroke-width="2"/>
  <ellipse cx="230" cy="162" rx="18" ry="16" fill="#FFF" stroke="#333" stroke-width="2"/>
  <circle cx="172" cy="164" r="4" fill="#333"/>
  <circle cx="232" cy="164" r="4" fill="#333"/>
  <path d="M150,142 L190,152 L190,148 L150,136 Z" fill="#333" stroke="#333" stroke-width="1"/>
  <path d="M250,142 L210,152 L210,148 L250,136 Z" fill="#333" stroke="#333" stroke-width="1"/>
</g>

<g id="eyebrows-none">
  <!-- No eyebrows — used with angry eyes which have built-in brows -->
</g>

<g id="clothing-jersey-f">
  <defs>
    <clipPath id="jClipF">
      <path d="M87,348 Q86,325 103,305 Q115,290 152,285 L175,280 Q200,292 225,280 L248,285 Q285,290 297,305 Q314,325 313,348 L288,348 L288,400 L112,400 L112,348 Z"/>
    </clipPath>
  </defs>
  <path d="M87,348 Q86,325 103,305 Q115,290 152,285 L175,280 Q200,292 225,280 L248,285 Q285,290 297,305 Q314,325 313,348 L288,348 L288,400 L112,400 L112,348 Z" fill="#E67E22" stroke="#333" stroke-width="2"/>
  <path d="M175,280 Q200,292 225,280" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- Horizontal stripes (clipped to jersey outline) -->
  <g clip-path="url(#jClipF)">
    <line x1="60" y1="308" x2="340" y2="308" stroke="#555" stroke-width="12"/>
    <line x1="60" y1="347" x2="340" y2="347" stroke="#555" stroke-width="12"/>
    <line x1="60" y1="386" x2="340" y2="386" stroke="#555" stroke-width="12"/>
  </g>
  <!-- Badge on upper-left chest -->
  <path d="M130,320 L130,336 Q130,346 142,346 Q154,346 154,336 L154,320 Z" fill="#FFF" stroke="#333" stroke-width="1.5"/>
  <line x1="142" y1="324" x2="142" y2="342" stroke="#333" stroke-width="1"/>
  <line x1="133" y1="333" x2="151" y2="333" stroke="#333" stroke-width="1"/>
  <!-- Bust seams -->
  <path d="M122,350 Q106,374 122,400" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M278,350 Q294,374 278,400" fill="none" stroke="#333" stroke-width="1.5"/>
</g>

<g id="mouth-frown">
  <path d="M175,230 Q200,210 225,230" fill="none" stroke="#333" stroke-width="2"/>
</g>

<g id="accessory-none">
  <!-- No accessory -->
</g>

<g id="hair-female-bob">
  <path d="M115,130 Q115,62 200,58 Q285,62 285,130 L290,185 Q295,218 272,222 L272,130 Q262,112 200,112 Q138,112 128,130 L128,222 Q105,218 110,185 Z" fill="#2C222B" stroke="#333" stroke-width="2"/>
</g>

<g id="accessoryii-none">
</g>

<g id="special-none">
  <!-- No special effect -->
</g>

</g>
</svg>