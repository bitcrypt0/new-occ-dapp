<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
<g id="bg-light-grey">
  <rect width="400" height="400" fill="#B5B5B5"/>
</g>

<defs><linearGradient id="fade-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="99%" stop-color="white"/><stop offset="100%" stop-color="black"/></linearGradient><mask id="fade-mask"><rect width="400" height="400" fill="url(#fade-grad)"/></mask></defs>
<g mask="url(#fade-mask)">
<g id="hair-back-none">
  <!-- No back fill needed for this hair variant -->
</g>

<g id="body-female-wide">
  <path d="M86,400 Q85,325 105,305 Q120,290 152,285 L180,282 L180,265 L220,265 L220,282 L248,285 Q280,290 295,305 Q315,325 314,400 Z" fill="#FFDBB4" stroke="#333" stroke-width="2"/>
</g>

<g id="head-round-female">
  <path d="M115,165 Q115,62 200,58 Q285,62 285,165 Q285,268 200,280 Q115,268 115,165 Z" fill="#FFDBB4" stroke="#333" stroke-width="2"/>
  <!-- Nose -->
  <path d="M194,191 Q200,201 206,191" fill="none" stroke="#333" stroke-width="1.5"/>
</g>

<g id="eyes-normal">
  <ellipse cx="170" cy="158" rx="18" ry="18" fill="#FFF" stroke="#333" stroke-width="2"/>
  <ellipse cx="230" cy="158" rx="18" ry="18" fill="#FFF" stroke="#333" stroke-width="2"/>
  <circle cx="172" cy="160" r="4" fill="#333"/>
  <circle cx="232" cy="160" r="4" fill="#333"/>
</g>

<g id="eyebrows-normal">
  <path d="M150,136 Q170,130 190,136" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <path d="M210,136 Q230,130 250,136" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
</g>

<g id="clothing-tshirt-f">
  <path d="M87,348 Q86,325 103,305 Q115,290 152,285 L175,280 Q200,292 225,280 L248,285 Q285,290 297,305 Q314,325 313,348 L288,348 L288,400 L112,400 L112,348 Z" fill="#9B59B6" stroke="#333" stroke-width="2"/>
  <!-- Double curve neck seam -->
  <path d="M175,280 Q200,292 225,280" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M169,283 Q200,296 231,283" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- Bust seams -->
  <path d="M122,350 Q106,374 122,400" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M278,350 Q294,374 278,400" fill="none" stroke="#333" stroke-width="1.5"/>
</g>

<g id="mouth-smile">
  <!-- Open mouth -->
  <path d="M175,220 Q200,246 225,220 Z" fill="#333" stroke="#333" stroke-width="2"/>
  <!-- Upper teeth row (curved) -->
  <path d="M178,220 Q200,230 222,220 Z" fill="#FFF" stroke="none"/>
  <!-- Tooth dividers -->
  <line x1="185" y1="220" x2="185" y2="222" stroke="#333" stroke-width="1"/>
  <line x1="192" y1="220" x2="192" y2="224" stroke="#333" stroke-width="1"/>
  <line x1="200" y1="220" x2="200" y2="225" stroke="#333" stroke-width="1"/>
  <line x1="208" y1="220" x2="208" y2="224" stroke="#333" stroke-width="1"/>
  <line x1="215" y1="220" x2="215" y2="222" stroke="#333" stroke-width="1"/>
</g>

<g id="accessory-none">
  <!-- No accessory -->
</g>

<g id="hair-female-bob">
  <path d="M115,130 Q115,62 200,58 Q285,62 285,130 L290,185 Q295,218 272,222 L272,130 Q262,112 200,112 Q138,112 128,130 L128,222 Q105,218 110,185 Z" fill="#2C222B" stroke="#333" stroke-width="2"/>
</g>

<g id="accessoryii-none">
</g>

<g id="special-none">
  <!-- No special effect -->
</g>

</g>
</svg>